# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Pick a file/dir via fzf popup, paste its path into the current command line
bind f display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'set f (fzf); and tmux send-keys -l -- "$f"'

# Copy current pane path to clipboard (WSL: clip.exe)
bind Y run-shell "printf '%s' '#{pane_current_path}' | clip.exe" \; display "Path copied"
