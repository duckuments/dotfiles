# vim: ft=tmux
# tmux-nova theme. Colors reuse the existing red/orange palette.

set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left ""
set -g @nova-nerdfonts-right ""

set -g @nova-pane-active-border-style "#f8b471"
set -g @nova-pane-border-style "#1a1a1a"

set -g @nova-status-style-bg "#1a1a1a"
set -g @nova-status-style-fg "#f0ebe6"
set -g @nova-status-style-active-bg "#ff7979"
set -g @nova-status-style-active-fg "#080808"
set -g @nova-status-style-double-bg "#080808"

set -g @nova-pane "#I  #W"

set -g @nova-segment-mode "#{?client_prefix,Ω,ω}"
set -g @nova-segment-mode-colors "#81c0b6 #080808"

set -g @nova-segment-whoami "#(whoami)@#h"
set -g @nova-segment-whoami-colors "#f8b471 #080808"

set -g @nova-rows 0
set -g @nova-segments-0-left "mode"
set -g @nova-segments-0-right "whoami"
